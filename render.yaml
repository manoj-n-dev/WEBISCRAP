# ==============================================================================
# WEBISCRAP — Render Blueprint Deployment Specification
# Infrastructure-as-Code for Render Web Service + Redis Scraping Queue Worker
# ==============================================================================

version: "1"

services:
  # ─── 1. Backend Web Service (FastAPI API) ──────────────────────────────────
  - type: web
    name: webiscrap-api
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        sync: false
        # PostgreSQL with asyncpg driver, e.g. postgresql+asyncpg://user:pass@host:port/dbname?ssl=require
      - key: REDIS_URL
        sync: false
        # Redis connection URL, e.g. rediss://default:token@host:port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GROQ_API_KEYS
        sync: false
        # Comma-separated Groq API keys for rotation
      - key: FRONTEND_URL
        sync: false
        # Production frontend URL on Vercel, e.g. https://webiscrap.vercel.app
      - key: BACKEND_CORS_ORIGINS
        sync: false
        # Optional comma-separated additional origins (e.g. preview domains)
      # --- Email: Render FREE blocks SMTP ports 25/465/587 -> use an HTTPS provider (Brevo/Resend) ---
      - key: EMAIL_PROVIDER
        value: auto
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAILS_FROM_EMAIL
        sync: false
        # MUST be the sender address verified in Brevo (or a verified Resend domain address)
      - key: EMAILS_FROM_NAME
        value: "WEBISCRAP"
      # SMTP is only a fallback (paid Render plans, or Brevo SMTP on port 2525)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: "true"
      # --- LLM budget / behaviour ---
      - key: GROQ_TIER
        value: free
      - key: ANALYZER_MODE
        value: heuristic
      - key: CLEANER_MODE
        value: deterministic
      - key: PLANNER_MODE
        value: llm   # set to "fast" to skip the planner LLM call (quicker, fewer tokens)
      - key: MAX_CONCURRENT_BROWSERS
        value: "1"
      - key: ENABLE_SCRAPE_WORKER
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false

